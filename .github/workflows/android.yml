name: Android debug APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: flyuia-android-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Checkout global airport database
        uses: actions/checkout@v4
        with:
          repository: davidmegginson/ourairports-data
          path: airport-source
      - name: Generate worldwide airport catalogue
        run: |
          mkdir -p app/src/main/assets
          python3 scripts/build_airport_catalog.py airport-source/airports.csv app/src/main/assets/airports.json.gz
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk flyUIA.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest flyUIA APK
          body: |
            Automatically updated APK from the latest successful build on main.
            Download flyUIA.apk and install it on your Android device.
          files: flyUIA.apk
          overwrite_files: true
          make_latest: true
